<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confirmation page for product review form submission.">
    <meta name="author" content="Martha Sibiya">
    <title>Review Submitted - Product Review</title>
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>

<header>
    <h1>Thank You!</h1>
</header>

<main>
    <p>Your review has been submitted successfully.</p>
    <p>Total Reviews Submitted: <span id="reviewCount">0</span></p>
    <a href="form.html">Submit Another Review</a>
</main>

<footer>
    <p>&copy; 2026 Product Review Form | WDD131 Assignment</p>
</footer>

<script>
    // LocalStorage counter
    let count = localStorage.getItem('reviewCount') || 0;
    count = parseInt(count) + 1;
    localStorage.setItem('reviewCount', count);
    document.getElementById('reviewCount').textContent = count;
</script>

</body>
</html>
