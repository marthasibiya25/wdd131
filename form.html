<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form for tracking reviews and feedback.">
    <meta name="author" content="Martha Sibiya">
    <title>Product Review Form - Project Review</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form id="reviewForm" method="get" action="review.html">

            <!-- Product Name -->
            <label for="product">Product Name *</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
                <!-- Options populated via JS -->
            </select>

            <!-- Overall Rating -->
<fieldset>
    <legend>Overall Rating *</legend>
    <h2>Features you found useful</h2>

    <input type="radio" id="rating1" name="rating" value="1" required>
    <label for="rating1">☆</label>

    <input type="radio" id="rating2" name="rating" value="2" required>
    <label for="rating2">☆☆</label>

    <input type="radio" id="rating3" name="rating" value="3" required>
    <label for="rating3">☆☆☆</label>

    <input type="radio" id="rating4" name="rating" value="4" required>
    <label for="rating4">☆☆☆☆</label>

    <input type="radio" id="rating5" name="rating" value="5" required>
    <label for="rating5">☆☆☆☆☆</label>
</fieldset>


            <!-- Date of Installation -->
            <label for="installDate">Date of Installation *</label>
            <input type="date" id="installDate" name="installDate" required>

            <!-- Useful Features -->
    <fieldset>
        <legend>Useful Features</legend>
    
        <input type="checkbox" id="feature1" name="features" value="Easy Setup">
        <label for="feature1">Easy Setup</label><br>
    
        <input type="checkbox" id="feature2" name="features" value="High Performance">
        <label for="feature2">High Performance</label><br>
    
        <input type="checkbox" id="feature3" name="features" value="Affordable Price">
        <label for="feature3">Affordable Price</label><br>
    
        <input type="checkbox" id="feature4" name="features" value="Good Support">
        <label for="feature4">Good Support</label>
    </fieldset>



            <!-- Written Review -->
            <label for="review">Written Review</label>
            <textarea id="review" name="review" rows="5" placeholder="Write your review..."></textarea>

            <!-- User Name -->
            <label for="userName">Your Name</label>
            <input type="text" id="userName" name="userName" placeholder="Optional">

            <!-- Submit Button -->
            <input type="submit" value="Submit Review">

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Martha Sibiya</p>
    </footer>

</body>

</html>
